name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-swift.sh
